// Owns the database and all business logic. The only module that holds a JDBC
// connection.
//
// Versions here are the ones the task 1.1 spike proved work together against
// SQLite — see design decision 3 for what it validated and the two DDL
// declaration rules it surfaced.

plugins {
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
}

dependencies {
    implementation project(':contracts')

    implementation libs.spring.boot.starter.web
    implementation libs.spring.boot.starter.data.jpa

    // SQLite is not a first-class Hibernate dialect; its support lives here.
    implementation libs.hibernate.community.dialects

    // Owns the schema. Hibernate only validates against what this produces.
    implementation libs.flyway.core

    runtimeOnly libs.sqlite.jdbc

    testImplementation libs.spring.boot.starter.test
}

tasks.named('test') {
    // Every Spring test names its own database under build/, so they never touch the real
    // one. Those files outlive a plain `build`, though, and a rerun then meets its own
    // leftovers — a UNIQUE barcode inserted last time, a counter already advanced. The suite
    // passed only on a clean build, which is not the same as passing.
    //
    // Deleting them here means every run starts where a new machine would: an empty file,
    // schema built by the migrations, nothing carried over.
    doFirst {
        delete(fileTree(layout.buildDirectory) { include '*.db' })
    }

    // A safety net for any future test that forgets to name its own: without this it would
    // fall through to data/bahi-khaata.db, the live shop database.
    systemProperty 'bahikhaata.db.path',
            layout.buildDirectory.file('test-default.db').get().asFile.absolutePath
}
