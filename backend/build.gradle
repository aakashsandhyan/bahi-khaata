// Owns the database and all business logic. The only module that holds a JDBC
// connection.
//
// Versions here are the ones the task 1.1 spike proved work together against
// SQLite — see design decision 3 for what it validated and the two DDL
// declaration rules it surfaced.

plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

dependencies {
    implementation project(':contracts')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // SQLite is not a first-class Hibernate dialect; its support lives here.
    implementation 'org.hibernate.orm:hibernate-community-dialects'

    // Owns the schema. Hibernate only validates against what this produces.
    implementation 'org.flywaydb:flyway-core'

    runtimeOnly 'org.xerial:sqlite-jdbc:3.49.1.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}
