# Infrastructure configuration only. Business parameters — margin thresholds,
# target margin, cart expiry — live in the SETTING table so they can be changed
# without a restart. See design decision 16.

spring.application.name=bahi-khaata-backend

# Local-first: the database is a single file on the store's own machine.
spring.datasource.url=jdbc:sqlite:${bahikhaata.db.path:data/bahi-khaata.db}
spring.datasource.driver-class-name=org.sqlite.JDBC

# SQLite serialises writes. A single connection avoids SQLITE_BUSY contention
# rather than retrying around it. Revisit only if a real bottleneck appears —
# with one terminal there is nothing to contend with.
spring.datasource.hikari.maximum-pool-size=1

# SQLite disables foreign-key enforcement on every new connection, so a
# REFERENCES clause is documentation until this turns it on. Unlike WAL (a
# persistent, once-only property set by the installer), foreign_keys is
# per-connection state that must be re-set each time — which is exactly what
# connection-init is for.
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON

# Hibernate never modifies the schema. Flyway owns it (task 1.5); Hibernate only
# checks that what it finds matches its mappings and refuses to start if not.
# `update` and `create-drop` must never appear in any profile — see design
# decision 3, and the test that enforces it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect

spring.jpa.open-in-view=false

# Flyway owns the schema and applies pending migrations at startup, tracked in
# its own history table. Migrations are forward-only — there are no down
# scripts, and rollback means restoring a backup. See design decision 4.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Refuse to start if an already-applied migration file has been edited. Changing
# applied history is how installations drift apart, which is the failure that
# stalled Chromis POS.
spring.flyway.validate-on-migrate=true

# A migration numbered below one already applied is a mistake, not a feature.
spring.flyway.out-of-order=false

# Every database this project creates starts empty and is built by V1 onwards,
# so there is never a pre-existing schema to baseline over. Leaving this off
# means an unexpectedly non-empty database fails loudly instead of being
# silently adopted.
spring.flyway.baseline-on-migrate=false
