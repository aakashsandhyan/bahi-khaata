pluginManagement {
    // Plugin versions come from the version catalog (gradle/libs.versions.toml). Only the
    // JavaFX plugin needs its repository declared; the Spring plugins are on the portal.
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

// Version catalog at gradle/libs.versions.toml is loaded automatically as `libs`.

rootProject.name = 'bahi-khaata'

// Each module is included only if its directory is present. Locally that is all of them; a
// container that builds only the backend copies just contracts and backend into its context,
// and Gradle would otherwise refuse outright to configure a module whose directory is not
// there. This keeps one settings file working in both places.
['contracts', 'backend', 'terminal', 'dashboard', 'architecture'].each { module ->
    if (file(module).isDirectory()) {
        include module
    }
}
