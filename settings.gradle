pluginManagement {
    // Plugin versions come from the version catalog (gradle/libs.versions.toml). Only the
    // JavaFX plugin needs its repository declared; the Spring plugins are on the portal.
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

// Version catalog at gradle/libs.versions.toml is loaded automatically as `libs`.

rootProject.name = 'bahi-khaata'

include 'contracts'
include 'backend'
include 'terminal'
include 'dashboard'

// Test-only module. Depends on all four so it can see their compiled classes
// and assert the boundaries between them. Ships nothing.
include 'architecture'
