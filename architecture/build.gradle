// Enforces the module boundaries declared in settings.gradle and design
// decision 1. Test-only — nothing here is packaged or shipped.
//
// This is the one module permitted to depend on every other, because seeing
// them all is precisely how it checks that they do not see each other.

dependencies {
    // :backend declares its Spring dependencies without versions, relying on the
    // dependency-management plugin it applies. Those coordinates arrive here
    // transitively, so this module needs the same BOM to resolve them.
    testImplementation platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")

    testImplementation project(':contracts')
    testImplementation project(':backend')
    testImplementation project(':terminal')
    testImplementation project(':dashboard')

    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
}
